name: Build split embodied AI paper bundles

on:
  push:
    branches:
      - embodied-report-papers-20260831
    paths:
      - ".github/workflows/build_embodied_paper_bundles_split.yml"
      - "paper_bundle/papers.tsv"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        category:
          - world_models
          - simulation
          - policy_models
          - task_relevant_reconstruction
          - goal_state_generation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and validate PDFs for category
        shell: bash
        env:
          CATEGORY: ${{ matrix.category }}
        run: |
          set -euo pipefail
          mkdir -p "paper_bundle/split/${CATEGORY}/files/${CATEGORY}"
          status="paper_bundle/split/${CATEGORY}/download_status.tsv"
          printf "category\tarxiv_id\ttitle\tfilename\tstatus\tbytes\tsource_url\n" > "$status"

          download_one() {
            local category="$1"
            local id="$2"
            local title="$3"
            local filename="$4"
            local out="paper_bundle/split/${CATEGORY}/files/${CATEGORY}/${filename}"
            local ok=0
            local used=""
            local sources=(
              "https://arxiv.org/pdf/${id}.pdf"
              "https://export.arxiv.org/pdf/${id}.pdf"
              "https://arxiv.org/pdf/${id}"
            )
            for url in "${sources[@]}"; do
              rm -f "${out}.part"
              if curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
                --connect-timeout 30 --max-time 600 \
                -A "Mozilla/5.0 (GitHub-Actions; embodied-research-split-bundle)" \
                "$url" -o "${out}.part"; then
                if [ "$(head -c 4 "${out}.part" || true)" = "%PDF" ] && [ "$(stat -c%s "${out}.part")" -gt 10000 ]; then
                  mv "${out}.part" "$out"
                  ok=1
                  used="$url"
                  break
                fi
              fi
              sleep 2
            done
            if [ "$ok" -eq 1 ]; then
              local size
              size="$(stat -c%s "$out")"
              printf "%s\t%s\t%s\t%s\tok\t%s\t%s\n" "$category" "$id" "$title" "$filename" "$size" "$used" >> "$status"
              echo "OK $id $filename ($size bytes)"
            else
              rm -f "${out}.part" "$out"
              printf "%s\t%s\t%s\t%s\tfailed\t0\t\n" "$category" "$id" "$title" "$filename" >> "$status"
              echo "FAILED $id $filename" >&2
              return 1
            fi
          }

          failures=0
          while IFS='|' read -r category id title filename; do
            [ "$category" = "$CATEGORY" ] || continue
            if ! download_one "$category" "$id" "$title" "$filename"; then
              failures=$((failures+1))
            fi
          done < paper_bundle/papers.tsv
          test "$failures" -eq 0

      - name: Create category ZIP
        shell: bash
        env:
          CATEGORY: ${{ matrix.category }}
        run: |
          set -euo pipefail
          root="paper_bundle/split/${CATEGORY}"
          count="$(find "$root/files" -type f -name '*.pdf' | wc -l | tr -d ' ')"
          bytes="$(du -sb "$root/files" | cut -f1)"
          {
            echo "# 具身智能方向论文子合集：${CATEGORY}"
            echo
            echo "- 生成日期：2026-08-31"
            echo "- PDF 数量：${count}"
            echo "- 文件总大小（字节）：${bytes}"
            echo "- 该子包属于完整的世界模型、仿真环境、策略模型与任务特定三维重建论文合集。"
          } > "$root/files/README.md"
          cp "$root/download_status.tsv" "$root/files/download_status.tsv"
          (cd "$root/files" && zip -0 -r "../${CATEGORY}.zip" .)
          sha256sum "$root/${CATEGORY}.zip" > "$root/${CATEGORY}.zip.sha256"
          ls -lh "$root/${CATEGORY}.zip"

      - name: Upload category bundle
        uses: actions/upload-artifact@v4
        with:
          name: embodied-papers-${{ matrix.category }}-20260831
          path: |
            paper_bundle/split/${{ matrix.category }}/${{ matrix.category }}.zip
            paper_bundle/split/${{ matrix.category }}/${{ matrix.category }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

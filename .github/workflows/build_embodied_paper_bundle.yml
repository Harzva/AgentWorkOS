name: Build embodied AI paper bundle

on:
  push:
    branches:
      - embodied-report-papers-20260831
    paths:
      - ".github/workflows/build_embodied_paper_bundle.yml"
      - "paper_bundle/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare manifest
